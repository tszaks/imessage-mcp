name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This server touches private messages, so requests that keep the user in control (explicit confirmation, opt-in flags, no network) are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first. The solution can come after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the server to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
